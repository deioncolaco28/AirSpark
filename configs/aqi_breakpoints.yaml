# AQI Breakpoints Configuration
# US EPA (Current 2024 Revised Standard) and India CPCB (NAAQS Standard)

US_EPA:
  standard_name: "United States Environmental Protection Agency AQI"
  standard_version: "2024 EPA Revised PM2.5 Standards (40 CFR Part 58 / Final Rule)"
  reporting_range: [0, 500]
  categories:
    - name: "Good"
      aqi_min: 0
      aqi_max: 50
      color: "#00E400"
      description: "Air quality is satisfactory, and air pollution poses little or no risk."
    - name: "Moderate"
      aqi_min: 51
      aqi_max: 100
      color: "#FFFF00"
      description: "Air quality is acceptable. However, there may be a risk for some people."
    - name: "Unhealthy for Sensitive Groups"
      aqi_min: 101
      aqi_max: 150
      color: "#FF7E00"
      description: "Members of sensitive groups may experience health effects."
    - name: "Unhealthy"
      aqi_min: 151
      aqi_max: 200
      color: "#FF0000"
      description: "Some members of the general public may experience health effects."
    - name: "Very Unhealthy"
      aqi_min: 201
      aqi_max: 300
      color: "#8F3F97"
      description: "Health alert: The risk of health effects is increased for everyone."
    - name: "Hazardous"
      aqi_min: 301
      aqi_max: 500
      color: "#7E0023"
      description: "Health warning of emergency conditions: everyone is more likely to be affected."

  breakpoints:
    # Concentration breakpoints: [C_low, C_high, I_low, I_high]
    # PM2.5 updated per EPA 2024 revised NAAQS & AQI Technical Guidelines
    pm2_5:  # ug/m3, 24-hr avg
      - [0.0, 9.0, 0, 50]
      - [9.1, 35.4, 51, 100]
      - [35.5, 55.4, 101, 150]
      - [55.5, 125.4, 151, 200]
      - [125.5, 225.4, 201, 300]
      - [225.5, 325.4, 301, 400]
      - [325.5, 500.4, 401, 500]


    pm10:  # ug/m3, 24-hr avg
      - [0, 54, 0, 50]
      - [55, 154, 51, 100]
      - [155, 254, 101, 150]
      - [255, 354, 151, 200]
      - [355, 424, 201, 300]
      - [425, 504, 301, 400]
      - [505, 604, 401, 500]

    no2:  # ppb, 1-hr avg
      - [0, 53, 0, 50]
      - [54, 100, 51, 100]
      - [101, 360, 101, 150]
      - [361, 649, 151, 200]
      - [650, 1249, 201, 300]
      - [1250, 1649, 301, 400]
      - [1650, 2049, 401, 500]

    so2:  # ppb, 1-hr avg
      - [0, 35, 0, 50]
      - [36, 75, 51, 100]
      - [76, 185, 101, 150]
      - [186, 304, 151, 200]
      - [305, 604, 201, 300]
      - [605, 804, 301, 400]
      - [805, 1004, 401, 500]

    co:  # ppm, 8-hr avg
      - [0.0, 4.4, 0, 50]
      - [4.5, 9.4, 51, 100]
      - [9.5, 12.4, 101, 150]
      - [12.5, 15.4, 151, 200]
      - [15.5, 30.4, 201, 300]
      - [30.5, 40.4, 301, 400]
      - [40.5, 50.4, 401, 500]

    o3:  # ppb, 8-hr avg
      - [0, 54, 0, 50]
      - [55, 70, 51, 100]
      - [71, 85, 101, 150]
      - [86, 105, 151, 200]
      - [106, 200, 201, 300]
      - [201, 404, 301, 400]
      - [405, 504, 401, 500]

INDIA_CPCB:
